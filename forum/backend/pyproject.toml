[project]
name = "forum-backend"
version = "0.1.0"
description = "FastAPI Backend for Forum"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "python-dotenv",
    "alembic>=1.18.4",
    "pyjwt[crypto]>=2.12.1",
    "pwdlib[argon2]>=0.3.0",
    "email-validator>=2.3.0",
    "psycopg[binary]>=3.3.3",
    "ruff>=0.15.12",
    "aiosqlite>=0.22.1",
    "slowapi>=0.1.9",
    "cryptography>=47.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv]
managed = true
package = false
